name: Temporary format V2 recovery
on:
  push:
    branches:
      - fix/preserve-legacy-v2-programmes-on-hydration
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prettier react-app.js supabase-sync.js tests/react-app.test.js --write
      - name: Commit formatter changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add react-app.js supabase-sync.js tests/react-app.test.js
          if ! git diff --cached --quiet; then
            git commit -m "Format V2 programme database recovery"
            git push
          fi
