name: Yuugee Supabase keepalive

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5,13,21 * * *"

permissions:
  contents: read

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check Supabase heartbeat
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          : "${SUPABASE_URL:?Set the SUPABASE_URL repository variable}"
          : "${SUPABASE_PUBLISHABLE_KEY:?Set the SUPABASE_PUBLISHABLE_KEY repository secret}"

          response="$(curl --fail --silent --show-error \
            --retry 3 --retry-delay 5 --max-time 20 \
            --header "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            "${SUPABASE_URL%/}/rest/v1/yuugee_heartbeat?select=id&id=eq.1")"

          printf '%s' "$response" | python3 -c 'import json,sys; assert json.load(sys.stdin) == [{"id":1}], "Unexpected heartbeat response"'
          echo "Supabase database responded successfully"
