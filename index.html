<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#10120f" />
    <meta
      name="description"
      content="An 8-week phone-first CrossFit programme generator, movement library, custom builder, and PR tracker for intermediate athletes."
    />
    <title>CrossFit Training Programme</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div class="app-shell">
        <section class="panel">
          <h1>CrossFit Training Programme</h1>
          <p class="muted-copy">
            Enable JavaScript to use the training programme, workout log, and PR
            tracker.
          </p>
        </section>
      </div>
    </noscript>
    <script
      src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"
      integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z"
      crossorigin="anonymous"
      defer
    ></script>
    <script
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"
      integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1"
      crossorigin="anonymous"
      defer
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"
      integrity="sha384-sLWJsCmP+Z4Qn+HgF7Hi64Djta4fZMu0fcgi3uUL3GFV/ubx2G86LPOuMf7+ZIyX"
      crossorigin="anonymous"
    ></script>
    <script>
      if (!window.supabase) {
        document.write(
          '<script src="https://unpkg.com/@supabase/supabase-js@2.57.4/dist/umd/supabase.js" integrity="sha384-sLWJsCmP+Z4Qn+HgF7Hi64Djta4fZMu0fcgi3uUL3GFV/ubx2G86LPOuMf7+ZIyX" crossorigin="anonymous"><\/script>',
        );
      }
    </script>
    <script src="./supabase-config.js" defer></script>
    <script src="./app.js" defer></script>
    <script src="./supabase-sync.js" defer></script>
    <script src="./react-app.js" defer></script>
  </body>
</html>
